# ===========================================================================
# DEPLOY.
#
#   merge/push em dev   ->  quiron-dev.fronteiratec.com
#   merge/push em main  ->  quiron.fronteiratec.com   (com aprovacao, se o
#                                                      environment `producao`
#                                                      exigir revisor)
#
# SEMPRE depois da CI: `publicar` depende de `ci`, que e o workflow de testes
# inteiro reusado. Nao ha caminho que suba codigo com o portao vermelho.
#
# A IMAGEM E CONSTRUIDA AQUI, NAO NO SERVIDOR. A VPS tem 2 GB e hospeda outros
# projetos; um build do Vite passa de 1 GB. Cada imagem leva a tag do commit
# (7 caracteres), entao rollback e trocar uma tag.
#
# O SERVIDOR NAO USA GIT. O repositorio e privado e o servidor nao tem (nem
# deve ter) credencial do GitHub. Este workflow copia para la so os arquivos
# que nao estao na imagem — compose, nginx, database, scripts — da MESMA
# versao da imagem, e roda scripts/deploy.sh. O diretorio proxy/ (o Caddy
# compartilhado com outros projetos) nunca e tocado.
#
# ROLLBACK: aba Actions > Deploy > Run workflow, escolha o ambiente e informe
# a versao (o SHA curto de um deploy anterior). Pula testes e build: a imagem
# daquela versao ja existe no GHCR.
#
# SECRETS (Settings > Environments > producao / desenvolvimento, ou no repo):
#   VPS_HOST          IP do servidor
#   VPS_PORTA         porta do SSH
#   VPS_USUARIO       deploy
#   VPS_SSH_CHAVE     a chave PRIVADA de deploy, o arquivo inteiro
#   VPS_KNOWN_HOSTS   a linha do known_hosts do servidor (ver docs/deploy.md)
#
# VARIABLES:
#   URL_PROD          https://quiron.fronteiratec.com
#   URL_DEV           https://quiron-dev.fronteiratec.com
# ===========================================================================
name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Onde subir
        type: choice
        options: [dev, prod]
        required: true
      versao:
        description: "Rollback: SHA curto de uma versao ja publicada. Vazio = a ponta da branch escolhida acima."
        required: false

concurrency:
  # Um deploy por ambiente de cada vez. `cancel-in-progress: false` porque
  # cancelar no meio deixa o ambiente pior do que deixar terminar.
  group: deploy-${{ inputs.ambiente || (github.ref_name == 'main' && 'prod' || 'dev') }}
  cancel-in-progress: false

jobs:
  # Decide o que sobe e para onde. Fica num job a parte para que as regras
  # estejam num lugar so, e nao espalhadas em `if:` pelos outros.
  alvo:
    name: Decidir versao e ambiente
    runs-on: ubuntu-latest
    outputs:
      ambiente: ${{ steps.decidir.outputs.ambiente }}
      sha: ${{ steps.decidir.outputs.sha }}
      tag: ${{ steps.decidir.outputs.tag }}
      construir: ${{ steps.decidir.outputs.construir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decidir
        id: decidir
        env:
          EVENTO: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          AMBIENTE_PEDIDO: ${{ inputs.ambiente }}
          VERSAO: ${{ inputs.versao }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" = "push" ]; then
            [ "$REF" = "main" ] && AMBIENTE=prod || AMBIENTE=dev
          else
            AMBIENTE="$AMBIENTE_PEDIDO"
          fi

          if [ -n "${VERSAO:-}" ]; then
            # Rollback: a versao precisa existir no historico do repositorio.
            SHA=$(git rev-parse --verify "${VERSAO}^{commit}") || {
              echo "::error::A versao '$VERSAO' nao existe no repositorio."; exit 1; }
            CONSTRUIR=false
          else
            SHA="$GITHUB_SHA"
            CONSTRUIR=true
            # Producao recebe codigo novo so da main. Rollback para uma versao
            # especifica pode vir de qualquer lugar: a imagem ja foi testada.
            if [ "$AMBIENTE" = "prod" ] && [ "$REF" != "main" ]; then
              echo "::error::Producao so recebe a ponta da main. Para rollback, informe a versao."
              exit 1
            fi
          fi

          {
            echo "ambiente=$AMBIENTE"
            echo "sha=$SHA"
            echo "tag=${SHA::7}"
            echo "construir=$CONSTRUIR"
          } >> "$GITHUB_OUTPUT"
          echo "### $AMBIENTE <- ${SHA::7}" >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: alvo
    if: needs.alvo.outputs.construir == 'true'
    uses: ./.github/workflows/ci.yml

  publicar:
    name: Construir e publicar imagens
    needs: [alvo, ci]
    if: needs.alvo.outputs.construir == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O label e o que deixa o deploy apagar imagens antigas DO QUIRON sem
      # encostar nas dos outros projetos do servidor (ver scripts/deploy.sh).
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/quiron-backend:${{ needs.alvo.outputs.tag }}
          labels: br.com.fronteiratec.app=quiron
          build-args: VERSAO=${{ needs.alvo.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/quiron-frontend:${{ needs.alvo.outputs.tag }}
          labels: br.com.fronteiratec.app=quiron
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  subir:
    name: Subir no servidor
    needs: [alvo, publicar]
    # Roda depois do build, ou direto (rollback) quando o build foi pulado de
    # proposito. `always()` porque, sem ele, um job pulado pula os seguintes.
    if: >-
      always() && needs.alvo.result == 'success' &&
      (needs.publicar.result == 'success' ||
       (needs.publicar.result == 'skipped' && needs.alvo.outputs.construir == 'false'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # O environment registra o historico de deploys por ambiente e e onde se
    # exige aprovacao manual para producao (Settings > Environments).
    environment:
      name: ${{ needs.alvo.outputs.ambiente == 'prod' && 'producao' || 'desenvolvimento' }}
      url: ${{ needs.alvo.outputs.ambiente == 'prod' && vars.URL_PROD || vars.URL_DEV }}
    env:
      AMBIENTE: ${{ needs.alvo.outputs.ambiente }}
      TAG: ${{ needs.alvo.outputs.tag }}
      DONO: ${{ github.repository_owner }}
    steps:
      # Os arquivos da MESMA versao da imagem — num rollback, os de la.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.alvo.outputs.sha }}

      - name: Preparar SSH
        env:
          CHAVE: ${{ secrets.VPS_SSH_CHAVE }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          PORTA: ${{ secrets.VPS_PORTA }}
          USUARIO: ${{ secrets.VPS_USUARIO }}
        run: |
          set -euo pipefail
          for v in CHAVE KNOWN_HOSTS HOST PORTA USUARIO; do
            [ -n "${!v}" ] || { echo "::error::Falta o secret VPS_$v (ver o cabecalho deste arquivo)."; exit 1; }
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Host key fixa, e nao ssh-keyscan: o keyscan aceitaria qualquer
          # servidor que respondesse naquele IP.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $HOST
            Port $PORTA
            User $USUARIO
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Copiar os arquivos da versao
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029  # $AMBIENTE expande aqui, de proposito.
          # So o que o stack le do disco. proxy/ fica de fora de proposito.
          git archive --format=tar HEAD \
              docker-compose.yml docker-compose.dev.yml .env.exemplo \
              nginx database scripts \
            | ssh vps "tar -x -C /opt/quiron/$AMBIENTE"

      - name: Deploy
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          BACK="ghcr.io/$DONO/quiron-backend:$TAG"
          FRONT="ghcr.io/$DONO/quiron-frontend:$TAG"
          # O token vai pelo stdin, nunca pela linha de comando (que aparece no
          # `ps` do servidor). O login fica num DOCKER_CONFIG temporario, apagado
          # ao fim: nenhuma credencial do GitHub sobra no servidor, e o token
          # expira junto com este job.
          # shellcheck disable=SC2029  # as variaveis expandem aqui, de proposito.
          printf '%s' "$TOKEN" | ssh vps "
            set -euo pipefail
            export DOCKER_CONFIG=\$(mktemp -d)
            trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT
            docker login ghcr.io -u '$ATOR' --password-stdin > /dev/null
            cd /opt/quiron/$AMBIENTE
            bash scripts/deploy.sh '$BACK' '$FRONT'
          " 2>&1 | tee deploy.log

      - name: Resumo
        if: always()
        run: |
          {
            echo "**Ambiente:** $AMBIENTE  "
            echo "**Versao:** \`$TAG\`"
            echo
            if grep -q '\[migracao\]   ok:' deploy.log 2>/dev/null; then
              echo "**Migracoes aplicadas:**"
              grep '\[migracao\]   ok:' deploy.log | sed 's/.*ok: /- /'
            else
              echo "Nenhuma migracao nova."
            fi
            if grep -q 'ERRO' deploy.log 2>/dev/null; then
              echo; echo '```'; grep -A3 'ERRO' deploy.log; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  fumaca:
    name: Conferir pela internet
    needs: [alvo, subir]
    if: always() && needs.subir.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: A versao nova responde no dominio publico
        env:
          URL: ${{ needs.alvo.outputs.ambiente == 'prod' && vars.URL_PROD || vars.URL_DEV }}
          TAG: ${{ needs.alvo.outputs.tag }}
        run: |
          if [ -z "${URL:-}" ]; then
            echo "::warning::Defina as variables URL_PROD e URL_DEV para ligar esta conferencia."
            exit 0
          fi
          # O deploy ja conferiu por dentro; isto confere o caminho inteiro —
          # DNS, certificado, Caddy, nginx — e que e a versao NOVA que responde.
          for tentativa in 1 2 3 4 5 6; do
            CORPO=$(curl -fsS --max-time 10 "$URL/api/health" || true)
            if echo "$CORPO" | grep -q "\"versao\":\"$TAG\""; then
              echo "$URL respondeu com a versao $TAG."
              exit 0
            fi
            echo "tentativa $tentativa: $CORPO"
            sleep 10
          done
          echo "::error::$URL nao respondeu com a versao $TAG."
          exit 1
