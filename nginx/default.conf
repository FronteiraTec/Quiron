# ===========================================================================
# Roteamento INTERNO de um ambiente.
#
# Nao escuta na internet: quem faz isso e o Caddy do proxy/, que termina TLS e
# encaminha para ca pelo alias `<stack>-web` da rede quiron-borda.
#
# CABECALHOS ENCAMINHADOS — o motivo do `map` abaixo
# Aqui dentro `$scheme` e SEMPRE http, porque o TLS terminou no Caddy. Enquanto
# este arquivo fazia `proxy_set_header X-Forwarded-Proto $scheme`, ele APAGAVA
# o "https" que o Caddy tinha acabado de informar, e a credencial publica
# montava a propria URL como http. O map preserva o que veio da borda e so cai
# no $scheme quando nao ha borda (desenvolvimento local, acesso direto).
#
# O mesmo vale para o Host, com um agravante de seguranca: enquanto o
# X-Forwarded-Host nao era fixado aqui, o valor chegava do CLIENTE e a
# credencial publica aceitava qualquer dominio nele (achado QRN-15). Agora
# quem manda e a borda, e o cabecalho do visitante e ignorado.
# ===========================================================================

map $http_x_forwarded_proto $proto_origem {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $host_origem {
    default $http_x_forwarded_host;
    ""      $host;
}

server {
    listen 80;
    server_name _;

    # Nao anuncie a versao do nginx nas respostas de erro.
    server_tokens off;

    location / {
        proxy_pass http://frontend:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_origem;

        proxy_cache_bypass $http_upgrade;
    }

    # Credencial publica de selo (migracao 017). Vai para o BACKEND, e nao para
    # o frontend, porque a pagina e renderizada la em HTML pronto: o crawler do
    # LinkedIn nao executa JavaScript, e uma rota do SPA nao geraria preview
    # nem texto legivel para quem so baixa o HTML.
    #
    # Fora de /api/ de proposito: esta URL e colada em perfil publico e mandada
    # por mensagem — precisa ser curta e nao parecer endpoint. Sem este bloco o
    # caminho cairia no frontend e voltaria o index.html.
    location /credencial/ {
        proxy_pass http://backend:3000/credencial/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A pagina monta a URL da propria credencial (que vai gravada na
        # certificacao do LinkedIn) a partir destes dois. Ver o cabecalho deste
        # arquivo: sao fixados aqui justamente para nao virem do visitante.
        proxy_set_header X-Forwarded-Proto $proto_origem;
        proxy_set_header X-Forwarded-Host $host_origem;
    }

    location /api/ {
        proxy_pass http://backend:3000/;

        # O padrao do nginx e 1MB, e ele recusa ANTES de a requisicao chegar na
        # API — um PDF de plano de negocio de 3MB morria aqui com um 413 em
        # HTML, sem passar pelas regras do arquivoService. O teto do app e 15MB
        # (arquivoService.MAX_PRIVADO); os 16MB dao folga para o overhead do
        # multipart. Quem recusa por tamanho continua sendo o app, com mensagem
        # em JSON — este limite so existe para nao ser mais apertado que ele.
        client_max_body_size 16m;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_origem;

        proxy_cache_bypass $http_upgrade;
    }
}
