server {
    listen 80;

    server_name localhost;

    location / {
        proxy_pass http://frontend:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://backend:3000/;

        # O padrao do nginx e 1MB, e ele recusa ANTES de a requisicao chegar na
        # API — um PDF de plano de negocio de 3MB morria aqui com um 413 em
        # HTML, sem passar pelas regras do arquivoService. O teto do app e 15MB
        # (arquivoService.MAX_PRIVADO); os 16MB dao folga para o overhead do
        # multipart. Quem recusa por tamanho continua sendo o app, com mensagem
        # em JSON — este limite so existe para nao ser mais apertado que ele.
        client_max_body_size 16m;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }
}