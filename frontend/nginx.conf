server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: qualquer rota (ex.: /login) devolve o index.html,
    # deixando o react-router resolver a navegacao no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
