server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    # `.mjs` como JavaScript. O mime.types do nginx so conhece `.js`, e o
    # worker do pdf.js sai do build como `pdf.worker.min-<hash>.mjs`: servido
    # como application/octet-stream, o navegador recusa carrega-lo como modulo
    # e TODO PDF desenhado na tela (Jornada, biblioteca do mentor) caia em
    # "Nao foi possivel ler este PDF" — sem erro no servidor que explicasse.
    #
    # O `include` vem junto de proposito: um bloco `types` sozinho SUBSTITUI a
    # tabela herdada, e o .js e o .css passariam a sair como octet-stream.
    # -----------------------------------------------------------------------
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # -----------------------------------------------------------------------
    # Os arquivos de /assets tem HASH no nome (index-cHK5l-C0.js): o conteudo
    # muda => o nome muda. Entao podem ser guardados para sempre; o navegador
    # nunca precisa perguntar se mudaram.
    #
    # `=404` e a parte importante. Sem ele, o fallback de SPA la embaixo pega
    # tambem os assets: um index.html velho (de antes do deploy) pede
    # `index-<hash antigo>.js`, o nginx responde 200 com o HTML da pagina, e o
    # navegador tenta interpretar HTML como modulo JavaScript — tela branca,
    # sem erro que explique nada. Com o =404 a falha e um 404 honesto.
    # -----------------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # -----------------------------------------------------------------------
    # O index.html NAO pode ser cacheado: e ele que diz quais assets carregar,
    # e um deploy troca esses nomes. Sem este cabecalho a resposta sai so com
    # ETag/Last-Modified, e o navegador aplica cache heuristico — continua
    # servindo o HTML antigo, apontando para assets que ja nao existem.
    #
    # Vale para o pedido direto e para o fallback abaixo: `try_files` faz um
    # redirecionamento interno para /index.html, que volta a casar aqui.
    # -----------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # SPA fallback: qualquer rota (ex.: /login) devolve o index.html,
    # deixando o react-router resolver a navegacao no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
