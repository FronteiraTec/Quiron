services:

  postgres:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: incubadora
    ports:
      - "2060:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - quiron
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d incubadora"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: node_api
    restart: always
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: incubadora
      DB_PORT: 5432
      JWT_SECRET: troque-este-segredo-em-producao
      JWT_EXPIRES: 8h
      # URL do frontend usada no link de redefinicao de senha.
      FRONTEND_URL: http://localhost
      # SMTP real (opcional). Sem isso, usa conta de teste Ethereal em dev.
      # SMTP_HOST: smtp.seuprovedor.com
      # SMTP_PORT: 587
      # SMTP_USER: usuario
      # SMTP_PASS: senha
      # EMAIL_FROM: "Quiron <no-reply@seudominio.com>"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quiron
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: react_app
    restart: always
    depends_on:
      - backend
    networks:
      - quiron

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - quiron

networks:
  quiron:
    driver: bridge

volumes:
  pgdata:
