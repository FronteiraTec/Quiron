services:

  postgres:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: incubadora
    ports:
      - "2060:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - quiron
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d incubadora"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: node_api
    restart: always
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: incubadora
      DB_PORT: 5432
      JWT_SECRET: troque-este-segredo-em-producao
      JWT_EXPIRES: 8h
      # Base dos links dentro dos emails (reset de senha, "ver na jornada").
      # Precisa ser um endereco que o DESTINATARIO consiga abrir: com emails
      # reais, "localhost" aponta para a maquina de quem recebe.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # SMTP. Os valores vem do arquivo .env (fora do git) — ver .env.example.
      # Com SMTP_HOST vazio, cai na conta de teste Ethereal e nada e enviado
      # de verdade: e o modo de desenvolvimento.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Google Agenda (OAuth 2.0). Sem GOOGLE_CLIENT_ID/SECRET a integracao
      # fica invisivel: o cartao nao aparece no Perfil e nada e enviado.
      # Ver docs/google-agenda.md para criar as credenciais.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Precisa ser IDENTICO ao "URI de redirecionamento autorizado" cadastrado
      # no Google Cloud. O padrao serve para o Nginx deste projeto.
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/api/google-agenda/callback}
      # Fuso declarado ao Google em cada evento. As colunas inicio_ts/fim_ts
      # guardam hora de parede, sem fuso: alguem precisa dizer "14h onde".
      TZ_AGENDA: ${TZ_AGENDA:-America/Sao_Paulo}
      # Chave que cifra os tokens do Google no banco (AES-256-GCM). Separada do
      # JWT_SECRET de proposito: trocar o JWT_SECRET derruba as sessoes e se faz
      # sem drama, mas trocar ESTA chave torna ilegivel todo refresh token ja
      # gravado e obriga todo mundo a reconectar a agenda.
      SECRET_KEY: ${SECRET_KEY:-}
      # Onde os arquivos enviados ficam DENTRO do container (volume `uploads`).
      UPLOAD_DIR: /app/uploads
    volumes:
      # Volume nomeado, nao bind mount: os arquivos precisam sobreviver ao
      # `--force-recreate` do container, que e rotina aqui a cada rebuild.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quiron
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: react_app
    restart: always
    depends_on:
      - backend
    networks:
      - quiron

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - quiron

networks:
  quiron:
    driver: bridge

volumes:
  pgdata:
  uploads:
